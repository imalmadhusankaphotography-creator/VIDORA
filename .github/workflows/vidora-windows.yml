name: VIDORA for Windows

# Every push to main builds VIDORA for Windows x64 (download it from the run's Artifacts).
# A tag like v0.9.0 also publishes the installer and the portable zip on the Releases page.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vidora-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      FILMCRAFT_BUILD_SHA: ${{ github.sha }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: vidora-windows
          cache-on-failure: true
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      # Microsoft's DirectX shader compiler, shipped beside VIDORA.exe (packaging/vidora/package.ps1)
      - name: Get the DirectX shader compiler
        shell: pwsh
        env:
          DXC_URL: https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.8.2505.1/dxc_2025_07_14.zip
          DXC_SHA256: 9ad895a6b039e3a8f8c22a1009f866800b840a74b50db9218d13319e215ea8a4
        run: |
          curl.exe -fsSL -o dxc.zip $env:DXC_URL
          $hash = (Get-FileHash dxc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:DXC_SHA256) { throw "dxc.zip has SHA-256 $hash, expected $env:DXC_SHA256" }
          Expand-Archive dxc.zip dxc-full -Force
          New-Item -ItemType Directory -Force dxc | Out-Null
          Copy-Item dxc-full\bin\x64\dxcompiler.dll, dxc-full\LICENSE-LLVM.txt, dxc-full\LICENSE-MIT.txt dxc
          "DXC_DIR=$((Resolve-Path dxc).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append
      # ci-run.ps1 turns a failure's compiler errors into an annotation on the run
      - name: Build
        shell: pwsh
        run: pwsh packaging/vidora/ci-run.ps1 -Title Build -Command "pwsh -NoProfile -File packaging\vidora\package.ps1 -BuildOnly"
      - name: Package
        shell: pwsh
        run: pwsh packaging/vidora/ci-run.ps1 -Title Package -Command "pwsh -NoProfile -File packaging\vidora\package.ps1 -SkipBuild"
      - name: Find the packages
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\VIDORA-*-portable.zip | Select-Object -First 1
          $msi = Get-ChildItem dist\VIDORA-*.msi | Select-Object -First 1
          "ZIP=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MSI=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v7
        with:
          name: VIDORA-windows-x64-portable
          path: ${{ env.ZIP }}
      - uses: actions/upload-artifact@v7
        with:
          name: VIDORA-windows-x64-installer
          path: ${{ env.MSI }}
      # Start the packaged app like a user and report whether its window comes up (with its log)
      # as an annotation; FilmCraft's own release runs alongside for comparison.
      - name: Smoke test VIDORA
        shell: pwsh
        run: pwsh packaging/vidora/smoke-test.ps1 -Zip "$env:ZIP"
      - name: Smoke test FilmCraft (upstream, for comparison)
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.9.0 -R storytold/filmcraft -p 'filmcraft-0.9.0-windows-x64-portable.zip' -D upstream --clobber
          pwsh packaging/vidora/smoke-test.ps1 -Zip upstream\filmcraft-0.9.0-windows-x64-portable.zip -Exe filmcraft.exe -Title "FilmCraft upstream" -Port 47932
      - name: Release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$env:MSI" "$env:ZIP" --title "VIDORA ${{ github.ref_name }}" --generate-notes
